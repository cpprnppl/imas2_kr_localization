<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>iM@S2 KOR</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@patternfly/patternfly@5.2.1/patternfly.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
/* PatternFly 위 최소 보정만 — 프레임워크 기본을 그대로 쓴다 */
[hidden]{display:none!important}
.pf-v5-c-page__sidebar-body{overflow-y:auto}
.kr-cell{cursor:text;white-space:pre-wrap;min-width:14rem}
.kr-cell:hover{outline:1px dashed var(--pf-v5-global--primary-color--100);outline-offset:2px}
.kr-cell.is-empty{color:var(--pf-v5-global--Color--200)}
.jp-cell{white-space:pre-wrap;color:var(--pf-v5-global--Color--100)}
.kr-miss{color:var(--pf-v5-global--danger-color--100);font-weight:700;text-decoration:underline}
td textarea{width:100%;min-height:4rem;font:inherit}
.thumb{background:repeating-conic-gradient(#9a9a9a 0 25%,#d4d4d4 0 50%) 0 0/12px 12px;
  display:inline-block;line-height:0;border:1px solid var(--pf-v5-global--BorderColor--100)}
.thumb img{image-rendering:pixelated;max-width:240px;max-height:72px;width:auto;height:auto}
.thumb-click{cursor:zoom-in}
.fr-del{background:rgba(214,54,40,.22);text-decoration:line-through;border-radius:2px}
.fr-add{background:rgba(62,163,90,.28);font-weight:600;border-radius:2px}
#frInfo td{white-space:pre-wrap}
.imgbox{background:repeating-conic-gradient(#9a9a9a 0 25%,#d4d4d4 0 50%) 0 0/16px 16px;
  border:1px solid var(--pf-v5-global--BorderColor--100);line-height:0;width:max-content;max-width:100%}
#imgView{image-rendering:pixelated;display:block}
.row-dim td{opacity:.55}
#gatewrap{min-height:100vh;display:flex;align-items:center;justify-content:center}
.v-mid{vertical-align:middle!important}
.pf-v5-c-page__sidebar .pf-v5-c-nav__link{cursor:pointer}
.nowrap{white-space:nowrap}
</style>
</head>
<body>
<div id="gatewrap">
  <div class="pf-v5-c-card" style="width:22rem">
    <div class="pf-v5-c-card__title"><h1 class="pf-v5-c-title pf-m-xl">iM@S2 KOR</h1></div>
    <div class="pf-v5-c-card__body">
      <p class="pf-v5-u-color-200 pf-v5-u-mb-md">아이돌마스터 2 한글화 번역 플랫폼.<br>디스코드에 공지된 참여 암호를 입력하세요.</p>
      <input class="pf-v5-c-form-control" style="display:block" id="pw" type="password" placeholder="참여 암호" autocomplete="off">
      <input class="pf-v5-c-form-control pf-v5-u-mt-sm" style="display:block" id="gnick" placeholder="작업자 이름 (기록에 남습니다)">
      <button class="pf-v5-c-button pf-m-primary pf-m-block pf-v5-u-mt-md" id="pwGo">입장</button>
      <p class="pf-v5-u-danger-color-100 pf-v5-u-mt-sm" id="gateMsg" style="min-height:1.2em"></p>
    </div>
  </div>
</div>

<div class="pf-v5-c-page" id="app" hidden>
  <header class="pf-v5-c-masthead">
    <span class="pf-v5-c-masthead__toggle">
      <button class="pf-v5-c-button pf-m-plain" id="navToggle" aria-label="메뉴">☰</button>
    </span>
    <div class="pf-v5-c-masthead__main"><span class="pf-v5-c-masthead__brand" style="font-weight:700">iM@S2 KOR</span></div>
    <div class="pf-v5-c-masthead__content">
      <div style="display:flex;gap:12px;align-items:center;width:100%">
        <span id="crumb" class="pf-v5-u-color-200"></span>
        <span style="flex:1"></span>
        <span id="budget" style="min-width:220px" hidden>
          <div class="pf-v5-c-progress pf-m-sm">
            <div class="pf-v5-c-progress__description" id="budgetLbl" style="font-size:12px"></div>
            <div class="pf-v5-c-progress__bar"><div class="pf-v5-c-progress__indicator" id="budgetBar"></div></div>
          </div>
        </span>
        <input class="pf-v5-c-form-control" style="width:9rem" id="nick" placeholder="작업자 이름">
        <span id="conn" class="pf-v5-c-label pf-m-green pf-m-compact"><span class="pf-v5-c-label__content">연결됨</span></span>
      </div>
    </div>
  </header>
  <div class="pf-v5-c-page__sidebar" id="sidebar">
    <div class="pf-v5-c-page__sidebar-body">
      <nav class="pf-v5-c-nav"><ul class="pf-v5-c-nav__list" id="nav" role="list"></ul></nav>
    </div>
  </div>
  <main class="pf-v5-c-page__main">
    <section class="pf-v5-c-page__main-section pf-m-light pf-m-no-padding" style="padding:8px 16px">
      <div class="pf-v5-c-toolbar"><div class="pf-v5-c-toolbar__content" style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
        <select class="pf-v5-c-form-control" style="width:auto" id="filter"></select>
        <input class="pf-v5-c-form-control" style="width:16rem" type="search" id="q" placeholder="검색 (원문·번역·식별자)">
        <button class="pf-v5-c-button pf-m-secondary" id="frOpen">바꾸기</button>
        <span id="grpStat" class="pf-v5-u-color-200" style="font-size:13px"></span>
        <span style="flex:1"></span>
        <nav class="pf-v5-c-pagination" style="display:flex;gap:6px;align-items:center">
          <select class="pf-v5-c-form-control" style="width:auto" id="perPage">
            <option value="100">100개씩</option><option value="200">200개씩</option><option value="500">500개씩</option>
          </select>
          <button class="pf-v5-c-button pf-m-plain" id="pgPrev">‹</button>
          <span id="pgInfo" class="nowrap" style="font-size:13px"></span>
          <button class="pf-v5-c-button pf-m-plain" id="pgNext">›</button>
        </nav>
      </div></div>
    </section>
    <section class="pf-v5-c-page__main-section" style="padding-top:8px">
      <div id="content"></div>
    </section>
  </main>
</div>

<!-- 찾아 바꾸기 모달 -->
<div class="pf-v5-c-backdrop" id="frModal" hidden>
  <div class="pf-v5-c-modal-box pf-m-md">
    <header class="pf-v5-c-modal-box__header">
      <h2 class="pf-v5-c-modal-box__title">찾아 바꾸기 — 현재 그룹의 한국어</h2>
    </header>
    <div class="pf-v5-c-modal-box__body" style="display:flex;flex-direction:column;gap:8px">
      <input class="pf-v5-c-form-control" id="frFind" placeholder="찾을 내용">
      <input class="pf-v5-c-form-control" id="frRepl" placeholder="바꿀 내용">
      <div id="frInfo" class="pf-v5-u-color-200" style="font-size:13px;white-space:pre-wrap;max-height:16rem;overflow:auto"></div>
    </div>
    <footer class="pf-v5-c-modal-box__footer" style="display:flex;gap:8px">
      <button class="pf-v5-c-button pf-m-secondary" id="frPreview">미리보기</button>
      <button class="pf-v5-c-button pf-m-primary" id="frApply" disabled>모두 바꾸기</button>
      <button class="pf-v5-c-button pf-m-link" id="frClose">닫기</button>
    </footer>
  </div>
</div>

<!-- 이미지 뷰어 -->
<div class="pf-v5-c-backdrop" id="imgModal" hidden>
  <div class="pf-v5-c-modal-box pf-m-lg" style="max-height:92vh;display:flex;flex-direction:column">
    <header class="pf-v5-c-modal-box__header">
      <h2 class="pf-v5-c-modal-box__title" id="imgTitle">원본 보기</h2>
    </header>
    <div class="pf-v5-c-modal-box__body" style="overflow:auto">
      <div style="margin-bottom:8px;display:flex;gap:6px;align-items:center;flex-wrap:wrap">
        <button class="pf-v5-c-button pf-m-control" data-z="1">1×</button>
        <button class="pf-v5-c-button pf-m-control" data-z="2">2×</button>
        <button class="pf-v5-c-button pf-m-control" data-z="4">4×</button>
        <span id="imgMeta" class="pf-v5-u-color-200" style="font-size:12px"></span>
      </div>
      <div id="imgStack" style="display:flex;flex-direction:column;gap:10px"></div>
    </div>
    <footer class="pf-v5-c-modal-box__footer">
      <button class="pf-v5-c-button pf-m-primary" id="imgClose">닫기</button>
    </footer>
  </div>
</div>

<!-- 수정 이력 모달 -->
<div class="pf-v5-c-backdrop" id="histModal" hidden>
  <div class="pf-v5-c-modal-box pf-m-md" style="max-height:80vh;display:flex;flex-direction:column">
    <header class="pf-v5-c-modal-box__header">
      <h2 class="pf-v5-c-modal-box__title" id="histTitle">수정 이력</h2>
    </header>
    <div class="pf-v5-c-modal-box__body" id="histBody" style="overflow:auto"></div>
    <footer class="pf-v5-c-modal-box__footer">
      <button class="pf-v5-c-button pf-m-primary" id="histClose">닫기</button>
    </footer>
  </div>
</div>

<script>
const CFG = /*__CFG__*/null;
const META = /*__DATA__*/null;
const MAP = new Set(META.mapchars);
const $ = s => document.querySelector(s);
const esc = s => (s == null ? "" : String(s)).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
// 스크립트 오류가 "무반응"으로 보이지 않게 게이트에 표시
window.addEventListener("error", e => {
  const g = document.getElementById("gateMsg");
  if (g && !document.getElementById("gatewrap").hidden)
    g.textContent = "스크립트 오류: " + (e.message || e.type);
});
const U16 = s => s.length;
const BYTES = s => 2 * (U16(s) + 1);

let sb = null, nick = "", teamCode = "";
const KRIMG = {};          // md5 -> {ts, by, url?} 이미지 작업본 메타/블롭 캐시
let cat = "xmb", grp = null;          // 현재 선택
let rows = [];                        // 현재 그룹 행 (메모리)
let filter = "all", query = "", page = 0, perPage = 100;
try {
  nick = localStorage.getItem("nick") || "";
  perPage = +(localStorage.getItem("pp") || 100);
} catch (e) {}

/* ---------------- 테마: OS 설정 따라 PF 다크 클래스 ---------------- */
function applyTheme() {
  document.documentElement.classList.toggle("pf-v5-theme-dark",
    matchMedia("(prefers-color-scheme: dark)").matches);
}
applyTheme();
try { matchMedia("(prefers-color-scheme: dark)").addEventListener("change", applyTheme); }
catch (e) { try { matchMedia("(prefers-color-scheme: dark)").addListener(applyTheme); } catch (e2) {} }

/* ---------------- 접속 ---------------- */
function makeClient(code) {
  return window.supabase.createClient(CFG.url, CFG.key,
    { global: { headers: { "x-team-code": code } }, auth: { persistSession: false } });
}
function withTimeout(p, ms) {
  return Promise.race([p, new Promise((_, rej) =>
    setTimeout(() => rej(new Error("timeout")), ms))]);
}
async function connect(code) {
  const cand = makeClient(code);
  let res;
  try {
    res = await withTimeout(cand.rpc("team_ok"), 10000);
  } catch (e) {
    // 왜 안 되는지 구분: 서버 자체 도달 가능 여부 (헤더 없는 단순 요청)
    let reach = "불가";
    try {
      await withTimeout(fetch(CFG.url + "/rest/v1/", { method: "GET" }), 5000);
      reach = "가능";
    } catch (e2) {}
    throw new Error(e.message === "timeout"
      ? `인증 요청 응답 없음 (서버 도달: ${reach}) — 네트워크/광고차단 확장/DNS를 확인하세요`
      : `${e.message} (서버 도달: ${reach})`);
  }
  if (res.error) throw new Error(res.error.message);
  if (res.data !== true) return false;
  sb = cand; teamCode = code;
  try { localStorage.setItem("pw", code); } catch (e) {}
  return true;
}

/* ---------------- 네비게이션 ---------------- */
function renderNav() {
  const ul = $("#nav"); ul.innerHTML = "";
  const dash = document.createElement("li");
  dash.className = "pf-v5-c-nav__item";
  dash.innerHTML = `<a class="pf-v5-c-nav__link${cat === "dash" ? " pf-m-current" : ""}" data-cat="dash">진행 현황</a>`;
  ul.appendChild(dash);
  for (const sec of META.nav) {
    const li = document.createElement("li");
    const open = sec.cat === cat;
    li.className = "pf-v5-c-nav__item pf-m-expandable" + (open ? " pf-m-expanded" : "");
    li.innerHTML = `
      <button class="pf-v5-c-nav__link" data-sec="${sec.cat}">
        ${esc(sec.label)}
        <span class="pf-v5-c-nav__toggle"><i class="pf-v5-c-nav__toggle-icon">${open ? "▾" : "▸"}</i></span>
      </button>
      <section class="pf-v5-c-nav__subnav" ${open ? "" : "hidden"}>
        <ul class="pf-v5-c-nav__list" role="list">
          ${sec.groups.map(g => `
            <li class="pf-v5-c-nav__item">
              <a class="pf-v5-c-nav__link${sec.cat === cat && g.g === grp ? " pf-m-current" : ""}"
                 data-cat="${sec.cat}" data-grp="${g.g}">${esc(g.label)}</a>
            </li>`).join("")}
        </ul>
      </section>`;
    ul.appendChild(li);
  }
  const li = document.createElement("li");
  li.className = "pf-v5-c-nav__item";
  li.innerHTML = `<a class="pf-v5-c-nav__link${cat === "activity" ? " pf-m-current" : ""}" data-cat="activity">수정 이력</a>`;
  ul.appendChild(li);
  ul.onclick = ev => {
    const a = ev.target.closest("[data-grp],[data-sec],[data-cat='activity'],[data-cat='dash']");
    if (!a) return;
    if (a.dataset.cat === "dash") { showDash(); return; }
    if (a.dataset.sec) {
      const item = a.closest(".pf-v5-c-nav__item");
      const sub = item.querySelector(".pf-v5-c-nav__subnav");
      sub.hidden = !sub.hidden;
      item.classList.toggle("pf-m-expanded", !sub.hidden);
      a.querySelector(".pf-v5-c-nav__toggle-icon").textContent = sub.hidden ? "▸" : "▾";
      return;
    }
    if (a.dataset.cat === "activity") { showActivity(); return; }
    openGroup(a.dataset.cat, a.dataset.grp);
  };
}

function navMeta(c, g) {
  const sec = META.nav.find(s => s.cat === c);
  return { sec, grp: sec && sec.groups.find(x => x.g === g) };
}

/* ---------------- 데이터 로드 ---------------- */
async function fetchAll(c, g) {
  const out = [];
  for (let from = 0; ; from += 1000) {
    const { data, error } = await sb.from("rows").select("*")
      .eq("cat", c).eq("grp", g).order("seq").range(from, from + 999);
    if (error) { toast("불러오기 실패: " + error.message); break; }
    out.push(...data);
    if (data.length < 1000) break;
  }
  return out;
}

function renderFilter() {
  const opts = cat === "image"
    ? [["all", "전체"], ["todo", "문구 미정"], ["translated", "번역됨 (식질 대기)"],
       ["edited", "식질됨 (검수 대기)"], ["done", "검수 완료"], ["warn", "경고 있음"]]
    : [["all", "전체"], ["todo", "미번역"], ["review", "번역됨 (검수 대기)"],
       ["done", "검수 완료"], ["warn", "경고 있음"]];
  const counts = {};
  for (const [v] of opts) counts[v] = 0;
  for (const r of rows) {
    for (const [v] of opts) if (passFilter(r, v)) counts[v]++;
  }
  $("#filter").innerHTML = opts.map(([v, l]) =>
    `<option value="${v}">${l} · ${counts[v]}</option>`).join("");
  $("#filter").value = filter;
}

async function openGroup(c, g) {
  closeNavIfNarrow();
  cat = c; grp = g; page = 0; filter = "all"; query = "";
  $("#q").value = "";
  renderNav();
  const { sec, grp: gm } = navMeta(c, g);
  $("#crumb").textContent = `${sec.label} › ${gm.label}`;
  $("#content").innerHTML = `<div class="pf-v5-c-empty-state"><div class="pf-v5-c-empty-state__content">불러오는 중…</div></div>`;
  rows = await fetchAll(c, g);
  if (c === "image") await loadKrimgList();
  render();
}

async function loadKrimgList() {
  const { data, error } = await sb.from("tex_kr").select("md5,ts,by").limit(1000);
  if (error) return;   // 테이블 미생성 등 — 작업본 없음으로 취급
  for (const v of data) {
    const old = KRIMG[v.md5];
    KRIMG[v.md5] = { ts: v.ts, by: v.by, url: old && old.ts === v.ts ? old.url : null };
  }
}

/* ---------------- 경고/통계 ---------------- */
function warns(r) {
  const w = [];
  if (r.cat === "image") {
    if (!r.kr) w.push(["문구 미정", "red"]);
    else {
      const miss = [...new Set([...r.kr].filter(ch => ch >= "가" && ch <= "힣" && !MAP.has(ch)))];
      if (miss.length) w.push(["폰트에 없음: " + miss.join(""), "red"]);
    }
    return w;
  }
  if (!r.jp) return w;
  if (!r.kr) { w.push(["미번역", "red"]); return w; }
  const nj = (r.jp.match(/\n/g) || []).length, nk = (r.kr.match(/\n/g) || []).length;
  if (nj !== nk) w.push([`개행 ${nk}/${nj}`, "red"]);
  if (U16(r.kr) > U16(r.jp) * 1.6 + 4) w.push([`길이 ${U16(r.kr)}/${U16(r.jp)}`, "orange"]);
  const miss = [...new Set([...r.kr].filter(ch => ch >= "가" && ch <= "힣" && !MAP.has(ch)))];
  if (miss.length) w.push(["폰트에 없음: " + miss.join(""), "red"]);
  return w;
}
const isBlank = r => r.cat !== "image" && !r.jp;

function grpStats() {
  let tgt = 0, tr = 0, rv = 0, ed = 0, bytes = 0;
  for (const r of rows) {
    if (cat === "xmb") bytes += BYTES(r.kr || r.jp);
    if (isBlank(r)) continue;
    tgt++;
    if (r.kr) tr++;
    if (r.st >= 2) rv++;
    if (r.cat === "image" && KRIMG[r.key]) ed++;
  }
  return { tgt, tr, rv, ed, bytes };
}

/* ---------------- 렌더 ---------------- */
function markMissing(kr) {
  return esc(kr).replace(/[가-힣]/g, ch => MAP.has(ch) ? ch : `<span class="kr-miss">${ch}</span>`);
}

function passFilter(r, f) {
  if (f === "all") return true;
  if (f === "warn") return warns(r).length > 0;
  if (isBlank(r)) return false;
  if (r.cat === "image") {
    const img = KRIMG[r.key];
    switch (f) {
      case "todo": return !r.kr;
      case "translated": return !!r.kr && !img;
      case "edited": return !!img && r.st < 2;
      case "done": return r.st >= 2;
    }
  }
  switch (f) {
    case "todo": return !r.kr;
    case "review": return !!r.kr && r.st < 2;
    case "done": return r.st >= 2;
  }
  return true;
}

function visibleRows() {
  const q = query.toLowerCase();
  return rows.filter(r => {
    if (q) {
      const m = r.meta || {};
      const hay = [r.key, r.jp, r.kr, m.sp, m.file,
                   (m.locs || []).join(" ")];
      if (!hay.some(s => (s || "").toLowerCase().includes(q))) return false;
    }
    return passFilter(r, filter);
  });
}

function stLabel(r) {
  return `
    <button class="pf-v5-c-button pf-m-compact ${r.st >= 1 && r.kr ? "pf-m-primary" : "pf-m-control"}" data-act="st1">번역</button>
    <button class="pf-v5-c-button pf-m-compact ${r.st >= 2 ? "pf-m-primary" : "pf-m-control"}" data-act="st2">검수</button>
    <button class="pf-v5-c-button pf-m-compact pf-m-plain" data-act="hist" title="수정 이력">🕘</button>`;
}

function render() {
  renderStats();
  const vis = visibleRows();
  const maxPage = Math.max(0, Math.ceil(vis.length / perPage) - 1);
  if (page > maxPage) page = maxPage;
  const slice = vis.slice(page * perPage, (page + 1) * perPage);
  $("#pgInfo").textContent = vis.length ? `${page * perPage + 1}–${page * perPage + slice.length} / ${vis.length}` : "0 / 0";

  const heads = cat === "image"
    ? ["원본 (JP)", "정보", "한국어 라벨", "경고", "상태"]
    : cat === "script"
      ? ["화자", "원문", "한국어", "경고", "상태"]
      : ["id", "원문", "한국어", "경고", "상태"];

async function krimgUrl(md5) {
  const meta = KRIMG[md5];
  if (!meta) return null;
  if (meta.url) return meta.url;
  const { data, error } = await sb.from("tex_kr").select("data").eq("md5", md5).single();
  if (error || !data) return null;
  const bin = atob(data.data);
  const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  meta.url = URL.createObjectURL(new Blob([arr], { type: "image/png" }));
  return meta.url;
}
async function loadKrThumb(md5, imgEl) {
  const u = await krimgUrl(md5);
  if (u) imgEl.src = u;
}

function renderStats() {
  const s = grpStats();

    $("#budgetBar").style.width = pct + "%";

}

/* ---------------- 이미지 작업본 업로드 ---------------- */
function needNick() {
  if (nick) return false;
  toast("작업자 이름을 먼저 입력하세요 (오른쪽 위)");
  $("#nick").focus();
  return true;
}
function pickUpload(r) {
  if (needNick()) return;
  const inp = document.createElement("input");
  inp.type = "file";
  inp.accept = "image/png";
  inp.onchange = () => { if (inp.files[0]) doUpload(r, inp.files[0]); };
  inp.click();
}
async function doUpload(r, file) {
  const m = r.meta || {};
  const buf = await file.arrayBuffer();
  if (buf.byteLength > 4 * 1024 * 1024) { toast("4MB 이하 PNG만 업로드할 수 있습니다"); return; }
  const bmp = await createImageBitmap(new Blob([buf]));
  if (bmp.width !== m.w || bmp.height !== m.h) {
    toast(`치수 불일치: 업로드 ${bmp.width}×${bmp.height} ≠ 원본 ${m.w}×${m.h} — 치수를 바꾸면 게임에 못 넣습니다`);
    return;
  }
  let b64 = "";
  const bytes = new Uint8Array(buf);
  for (let i = 0; i < bytes.length; i += 0x8000)
    b64 += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  b64 = btoa(b64);
  const ts = Date.now();
  const { error } = await sb.from("tex_kr").upsert({ md5: r.key, data: b64, ts, by: nick });
  if (error) { toast("업로드 실패: " + error.message); return; }
  const old = KRIMG[r.key];
  if (old && old.url) URL.revokeObjectURL(old.url);
  KRIMG[r.key] = { ts, by: nick, url: URL.createObjectURL(new Blob([bytes], { type: "image/png" })) };
  toast("작업본 업로드 완료", "success");
  render();
}

function openEditorFor(r) {
  const vis = visibleRows();
  const i = vis.indexOf(r);
  if (i < 0) return;
  page = Math.floor(i / perPage);
  render();
  const tr = document.querySelector(`tr[data-id="${CSS.escape(r.id)}"]`);
  if (!tr) return;
  tr.scrollIntoView({ block: "center" });
  const td = tr.querySelector(".kr-cell");
  if (td) startEdit(r, td);
}

function startEdit(r, td) {
  if (needNick()) return;
  if (td.querySelector("textarea")) return;
  const ta = document.createElement("textarea");
  ta.className = "pf-v5-c-form-control";
  ta.value = r.kr;
  td.textContent = ""; td.appendChild(ta); ta.focus();
  let moved = null;   // Enter/Tab = 저장 후 다음 행, Alt+↑↓ = 이동, Esc = 취소
  ta.onkeydown = ev => {
    if (ev.key === "Enter" && !ev.shiftKey) { ev.preventDefault(); moved = 1; ta.blur(); }
    else if (ev.key === "Tab") { ev.preventDefault(); moved = ev.shiftKey ? -1 : 1; ta.blur(); }
    else if (ev.key === "ArrowDown" && ev.altKey) { ev.preventDefault(); moved = 1; ta.blur(); }
    else if (ev.key === "ArrowUp" && ev.altKey) { ev.preventDefault(); moved = -1; ta.blur(); }
    else if (ev.key === "Escape") { moved = 0; ta.value = r.kr; ta.blur(); }
  };
  ta.onblur = () => {
    const dir = moved; moved = null;
    const v = ta.value.replace(/\r\n/g, "\n").replace(/\s+$/, "");
    if (v !== r.kr) save(r, v, v ? Math.max(1, r.st) : 0);
    else render();
    if (dir === 1 || dir === -1) {
      const vis = visibleRows();
      let i = vis.indexOf(r) + dir;
      while (i >= 0 && i < vis.length && isBlank(vis[i])) i += dir;
      if (i >= 0 && i < vis.length) setTimeout(() => openEditorFor(vis[i]), 0);
    }
  };
}

function setSt(r, st) {
  if (needNick()) return;
  if (st >= 1 && !r.kr && r.cat !== "image") { toast("번역문이 비어 있습니다"); return; }
  save(r, r.kr, st);
}

async function save(r, kr, st, quiet) {
  const prev = { kr: r.kr, st: r.st };
  r.kr = kr; r.st = st; r.ts = Date.now(); r.by = nick;
  if (!quiet) render();
  const { error } = await sb.from("rows").upsert({
    id: r.id, cat: r.cat, grp: r.grp, seq: r.seq, key: r.key,
    jp: r.jp, kr, st, ts: r.ts, by: nick, meta: r.meta || {} });
  if (error) {
    r.kr = prev.kr; r.st = prev.st; render();
    toast("저장 실패: " + error.message);
    return;
  }
  sb.from("hist").insert({ row_id: r.id, cat: r.cat, grp: r.grp, key: r.key,
    ts: r.ts, by: nick, kr, st }).then(() => {});
}

let DASH = null;
async function countQ(c, g, extra) {
  let q = sb.from("rows").select("id", { count: "exact", head: true })
    .eq("cat", c).eq("grp", g);
  if (extra) q = extra(q);
  const { count } = await q;
  return count || 0;
}
async function showDash(force) {
  closeNavIfNarrow();
  cat = "dash"; grp = null; renderNav();
  $("#crumb").textContent = "진행 현황";
  $("#budget").hidden = true; $("#grpStat").textContent = "";
  if (!DASH || force) {
    $("#content").innerHTML = `<div class="pf-v5-c-empty-state"><div class="pf-v5-c-empty-state__content">집계 중…</div></div>`;
    const out = [];
    for (const sec of META.nav) {
      const rows_ = await Promise.all(sec.groups.map(async gm => {
        const [tgt, tr, rv] = await Promise.all([
          countQ(sec.cat, gm.g, sec.cat === "image" ? null : q => q.neq("jp", "")),
          countQ(sec.cat, gm.g, q => q.neq("kr", "")),
          countQ(sec.cat, gm.g, q => q.eq("st", 2)),
        ]);
        return { gm, tgt, tr, rv };
      }));
      out.push({ sec, rows: rows_ });
    }
    DASH = out;
  }
  if (cat !== "dash") return;   // 집계 중 다른 메뉴로 이동한 경우
  const bar = (n, d, color) => {
    const pct = d ? Math.round(100 * n / d) : 0;
    return `<div class="pf-v5-c-progress pf-m-sm" style="min-width:140px">
      <div class="pf-v5-c-progress__bar"><div class="pf-v5-c-progress__indicator" style="width:${pct}%${color ? ";background:" + color : ""}"></div></div></div>`;
  };
  $("#content").innerHTML = DASH.map(({ sec, rows: rs }) => {
    const T = rs.reduce((a, r) => a + r.tgt, 0), TR = rs.reduce((a, r) => a + r.tr, 0),
          RV = rs.reduce((a, r) => a + r.rv, 0);
    return `<h2 class="pf-v5-c-title pf-m-lg" style="margin:14px 0 6px">${esc(sec.label)}
      <span class="pf-v5-u-color-200" style="font-size:13px;font-weight:400"> 번역 ${TR.toLocaleString()}/${T.toLocaleString()} · 검수 ${RV.toLocaleString()}</span></h2>
    <table class="pf-v5-c-table pf-m-compact"><thead class="pf-v5-c-table__thead"><tr class="pf-v5-c-table__tr">
      <th class="pf-v5-c-table__th" style="width:16rem">소분류</th>
      <th class="pf-v5-c-table__th">번역</th><th class="pf-v5-c-table__th" style="width:10rem"></th>
      <th class="pf-v5-c-table__th">검수</th><th class="pf-v5-c-table__th" style="width:10rem"></th></tr></thead>
    <tbody class="pf-v5-c-table__tbody">${rs.map(r => `
      <tr class="pf-v5-c-table__tr">
        <td class="pf-v5-c-table__td"><a href="#" data-open="${sec.cat}:${r.gm.g}">${esc(r.gm.label)}</a></td>
        <td class="pf-v5-c-table__td nowrap" style="font-variant-numeric:tabular-nums">${r.tr}/${r.tgt}</td>
        <td class="pf-v5-c-table__td">${bar(r.tr, r.tgt)}</td>
        <td class="pf-v5-c-table__td nowrap" style="font-variant-numeric:tabular-nums">${r.rv}/${r.tgt}</td>
        <td class="pf-v5-c-table__td">${bar(r.rv, r.tgt, "var(--pf-v5-global--success-color--100)")}</td>
      </tr>`).join("")}</tbody></table>`;
  }).join("") +
  `<p style="margin-top:12px"><button class="pf-v5-c-button pf-m-secondary" id="dashRefresh">새로 집계</button></p>`;
  $("#dashRefresh").onclick = () => showDash(true);
  $("#content").querySelectorAll("[data-open]").forEach(a => a.onclick = ev => {
    ev.preventDefault();
    const [c, g] = a.dataset.open.split(":");
    openGroup(c, g);
  });
}

let toastTimer;

  let el = $("#toast");

    el = document.createElement("div");
    el.id = "toast";
    el.style.cssText = "position:fixed;bottom:16px;right:16px;z-index:99;max-width:24rem";

  el.className = `pf-v5-c-alert pf-m-${kind || "danger"} pf-m-inline`;
  el.innerHTML = `<div class="pf-v5-c-alert__title">${esc(msg)}</div>`;
  el.hidden = false;
  clearTimeout(toastTimer);

}

  $("#frModal").hidden = false;
  $("#frFind").focus();
};
$("#frClose").onclick = () => $("#frModal").hidden = true;
$("#frModal").addEventListener("click", ev => { if (ev.target === $("#frModal")) $("#frModal").hidden = true; });
$("#frPreview").onclick = () => {
  const f = $("#frFind").value;
  if (!f) return;
  const rep = $("#frRepl").value;
  frMatches = rows.filter(r => r.kr && r.kr.indexOf(f) >= 0);
  if (!frMatches.length) {
    $("#frInfo").textContent = "발견된 행이 없습니다";
    $("#frApply").disabled = true;
    return;
  }
  const mark = (s, needle, cls, subst) => s.split(needle).map(esc)
    .join(`<mark class="${cls}">${esc(subst !== undefined ? subst : needle)}</mark>`);
  const rowsHtml = frMatches.slice(0, 20).map(r => `
    <tr class="pf-v5-c-table__tr">
      <td class="pf-v5-c-table__td"><code style="font-size:11px">${esc(r.key)}</code></td>
      <td class="pf-v5-c-table__td">${mark(r.kr, f, "fr-del")}</td>
      <td class="pf-v5-c-table__td">${mark(r.kr, f, "fr-add", rep)}</td>
    </tr>`).join("");
  $("#frInfo").innerHTML = `<p class="pf-v5-u-mb-sm"><b>${frMatches.length}</b>개 행에서 발견${frMatches.length > 20 ? " (앞 20개 표시)" : ""}</p>
    <table class="pf-v5-c-table pf-m-compact">
      <thead class="pf-v5-c-table__thead"><tr class="pf-v5-c-table__tr">
        <th class="pf-v5-c-table__th">행</th><th class="pf-v5-c-table__th">현재</th><th class="pf-v5-c-table__th">변경 후</th></tr></thead>
      <tbody class="pf-v5-c-table__tbody">${rowsHtml}</tbody></table>`;
  $("#frApply").disabled = false;
};
$("#frApply").onclick = async () => {
  if (needNick()) return;
  const f = $("#frFind").value, rep = $("#frRepl").value;
  $("#frApply").disabled = true; $("#frPreview").disabled = true;
  let n = 0;
  for (const r of frMatches) {
    const v = r.kr.split(f).join(rep);
    if (v !== r.kr) { await save(r, v, Math.max(1, r.st), true); n++; }
    if (n % 10 === 0) $("#frInfo").textContent = `바꾸는 중… ${n}/${frMatches.length}`;
  }
  $("#frInfo").textContent = `완료: ${n}개 행 변경 (행마다 수정 이력에 기록됨)`;
  $("#frPreview").disabled = false;
  render();
};

$("#filter").onchange = ev => { filter = ev.target.value; page = 0; render(); };
let qt; $("#q").oninput = ev => { clearTimeout(qt); qt = setTimeout(() => { query = ev.target.value.trim(); page = 0; render(); }, 250); };
$("#perPage").value = String(perPage);
$("#perPage").onchange = ev => { perPage = +ev.target.value; page = 0;
  try { localStorage.setItem("pp", String(perPage)); } catch (e) {} render(); };
$("#pgPrev").onclick = () => { if (page > 0) { page--; render(); } };
$("#pgNext").onclick = () => { page++; render(); };
$("#navToggle").onclick = () => {
  const el = $("#sidebar");
  if (innerWidth >= 1200) el.classList.toggle("pf-m-collapsed");
  else el.classList.toggle("pf-m-expanded");   // PF: 좁은 화면에선 expanded가 있어야 보임
};
function closeNavIfNarrow() {
  if (innerWidth < 1200) $("#sidebar").classList.remove("pf-m-expanded");
}
$("#nick").onchange = ev => { nick = ev.target.value.trim();
  try { localStorage.setItem("nick", nick); } catch (e) {} };
document.addEventListener("keydown", ev => {   // '/' = 검색 포커스
  if (ev.key === "/" && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) {
    ev.preventDefault(); $("#q").focus();
  }
});

/* ---------------- 부팅 ---------------- */
async function boot() {
  $("#gatewrap").hidden = true;
  $("#gatewrap").style.display = "none";   // CSS display:flex보다 확실하게
  $("#app").hidden = false;
  $("#nick").value = nick;
  renderNav();
  showDash();   // 홈 = 진행 현황
}
// 게이트 핸들러는 어떤 비동기 작업보다 먼저 바인딩한다 (무반응 방지)
const go = async () => {
  $("#gateMsg").textContent = "";
  if (!CFG) { $("#gateMsg").textContent = "오프라인 빌드 — 접속 불가"; return; }
  if (!window.supabase) {
    $("#gateMsg").textContent = "라이브러리 로드 실패 — 새로고침하거나 차단 확장(애드블록)을 확인하세요";
    return;
  }
  const v = $("#pw").value;
  if (!v) { $("#gateMsg").textContent = "암호를 입력하세요"; return; }
  $("#pwGo").disabled = true;
  $("#gateMsg").textContent = "확인 중…";
  nick = $("#gnick").value.trim() || nick;
  try { localStorage.setItem("nick", nick); } catch (e) {}
  let ok = false;
  try { ok = await connect(v); }
  catch (e) { $("#gateMsg").textContent = "접속 오류: " + (e.message || e); }
  if (ok) boot();
  else if ($("#gateMsg").textContent === "확인 중…")
    $("#gateMsg").textContent = "암호가 맞지 않습니다";
  $("#pwGo").disabled = false;
};
$("#pwGo").onclick = go;
$("#pw").addEventListener("keydown", ev => { if (ev.key === "Enter") go(); });
$("#gnick").value = nick;

(async () => {
  if (!CFG || !window.supabase) return;
  let pw = "";
  try { pw = localStorage.getItem("pw") || ""; } catch (e) {}
  if (!pw) return;
  try { if (await connect(pw)) boot(); } catch (e) {}
})();
</script>
</body>
