<!doctype html>
<meta charset="utf-8">

<title>iM@S2 XMB 번역표</title>

<style>

[hidden]{display:none!important}
img{max-width:100%}
:root{
  --bg:#f4f4f2; --surface:#ffffff; --fg:#1c1d1f; --muted:#6e7075;
  --line:#d8d8d4; --accent:#31557d; --accent-fg:#ffffff;
  --ok:#2f7d4f; --warn:#9a6700; --err:#b3362b; --hl:#fdf6e3;
  --mono:ui-monospace,Consolas,"Cascadia Mono",monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#17181a; --surface:#1f2023; --fg:#e8e8e6; --muted:#9a9ca1;
  --line:#3a3b3e; --accent:#7da4cc; --accent-fg:#14161a;
  --ok:#5fb982; --warn:#d7a53f; --err:#e07b70; --hl:#2a2618;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#17181a; --surface:#1f2023; --fg:#e8e8e6; --muted:#9a9ca1;
  --line:#3a3b3e; --accent:#7da4cc; --accent-fg:#14161a;
  --ok:#5fb982; --warn:#d7a53f; --err:#e07b70; --hl:#2a2618;
  color-scheme:dark }
body{background:var(--bg);color:var(--fg);
  font:13px/1.55 "Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  margin:0;padding-block:0 32px}
#top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;
  background:var(--bg);border-bottom:1px solid var(--line);
  padding:8px 16px 0;display:flex;flex-direction:column;gap:6px}
#top .r1{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
h1{font-size:15px;font-weight:700;margin:0}
#who{color:var(--muted);font-size:12px}
#tabs{display:flex;gap:2px}
#tabs button{border:1px solid var(--line);border-bottom:none;background:var(--surface);
  color:var(--fg);padding:5px 12px;font:inherit;cursor:pointer}
#tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-fg);
  border-color:var(--accent);font-weight:500}
#tabs .n{color:inherit;opacity:.75;font-size:11px;margin-left:6px;font-variant-numeric:tabular-nums}
.r2{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-bottom:8px}
.r2 select,.r2 input[type=search]{font:inherit;color:var(--fg);background:var(--surface);
  border:1px solid var(--line);padding:4px 8px}
.r2 input[type=search]{width:220px;max-width:45vw}
#budget{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);
  font-variant-numeric:tabular-nums}
#budget .bar{width:140px;height:8px;border:1px solid var(--line);background:var(--surface)}
#budget .bar i{display:block;height:100%;background:var(--ok)}
#budget.over .bar i{background:var(--err)}
#budget.over{color:var(--err);font-weight:500}
#msg{font-size:12px;color:var(--err)}
main{padding:0 16px}
table{border-collapse:collapse;width:100%;table-layout:fixed}
th{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--thdr,96px));
  background:var(--bg);z-index:4;text-align:left;font-size:11px;font-weight:500;
  color:var(--muted);border-bottom:1px solid var(--line);padding:4px 8px}
td{border-bottom:1px solid var(--line);padding:5px 8px;vertical-align:top;
  overflow-wrap:break-word}
col.c-id{width:118px}col.c-st{width:72px}col.c-w{width:92px}
td.id{font-family:var(--mono);font-size:11px;color:var(--muted)}
td.jp,td.cn{white-space:pre-wrap;color:var(--fg)}
td.cn{color:var(--muted)}
td.kr{white-space:pre-wrap;cursor:text}
td.kr:hover{background:var(--hl)}
td.kr.empty::before{content:"—";color:var(--muted)}
td.kr textarea{width:100%;box-sizing:border-box;font:inherit;color:var(--fg);
  background:var(--surface);border:1px solid var(--accent);padding:4px 6px;
  resize:vertical;min-height:3.2em}
td.kr .miss{color:var(--err);font-weight:700;text-decoration:underline}
.badges{display:flex;flex-wrap:wrap;gap:3px}
.b{font-size:10px;padding:0 5px;border:1px solid currentColor}
.b.w{color:var(--warn)} .b.e{color:var(--err)} .b.m{color:var(--muted)}
td.st{white-space:nowrap}
.chk{display:inline-block;border:1px solid var(--line);background:var(--surface);
  color:var(--muted);font-size:11px;padding:1px 7px;cursor:pointer;user-select:none}
.chk+.chk{margin-left:3px}
.chk.on1{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.chk.on2{background:var(--ok);border-color:var(--ok);color:#fff}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-left:5px;
  vertical-align:middle}
.dot.saving{background:var(--warn)} .dot.fail{background:var(--err)}
tr.done td{opacity:.62}
tr.blank td{opacity:.4}
#empty{color:var(--muted);padding:40px 0;text-align:center}
#gate{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;
  align-items:center;justify-content:center}
.gatebox{background:var(--surface);border:1px solid var(--line);padding:28px 32px;
  display:flex;flex-direction:column;gap:10px;width:300px;max-width:88vw}
.gatebox h2{margin:0;font-size:15px}
.gatebox p{margin:0;font-size:12px;color:var(--muted)}
.gatebox input{font:inherit;color:var(--fg);background:var(--surface);
  border:1px solid var(--line);padding:6px 8px}
.gbtn{font:inherit;background:var(--accent);color:var(--accent-fg);
  border:1px solid var(--accent);padding:6px;cursor:pointer}
#gateMsg{font-size:12px;color:var(--err);min-height:1em}
#nick{font:inherit;color:var(--fg);background:var(--surface);
  border:1px solid var(--line);padding:3px 8px;width:110px}
@media (max-width:700px){ col.c-id{width:84px} .r2 input[type=search]{width:130px} }
</style>

<div id="gate" hidden>
  <div class="gatebox">
    <h2>iM@S2 XMB 번역표</h2>
    <p>디스코드 채널에 공지된 참여 암호를 입력하세요.</p>
    <input id="pw" type="password" autocomplete="off" placeholder="암호">
    <button class="gbtn" id="pwGo">입장</button>
    <div id="gateMsg"></div>
  </div>
</div>
<div id="top">
  <div class="r1">
    <h1>iM@S2 XMB 번역표</h1>
    <input id="nick" placeholder="작성자 이름" title="저장 기록에 남는 이름">
    <span id="who">연결 중…</span>
    <span id="msg"></span>
  </div>
  <div class="r1" style="justify-content:space-between">
    <div id="tabs" role="tablist"></div>
    <div id="budget"><span id="bt"></span><span class="bar"><i id="bi"></i></span></div>
  </div>
  <div class="r2">
    <select id="filter">
      <option value="all">전체</option>
      <option value="todo">미번역</option>
      <option value="warn">경고 있음</option>
      <option value="review">검수 대기</option>
      <option value="done">검수 완료</option>
    </select>
    <input type="search" id="q" placeholder="id·원문·번역 검색">
    <span style="font-size:12px;color:var(--muted)">
      한국어 칸을 클릭해 입력, 바깥 클릭으로 저장 · [번역]→[검수] 단계 체크</span>
  </div>
</div>
<main><div id="tbl"></div></main>

  return { tgt, tr, rv, bytes };
}

function renderTabs() {
  const el = $("#tabs"); el.innerHTML = "";
  for (const fi of DATA.files) {
    const s = stats(fi);
    const b = document.createElement("button");
    b.setAttribute("role", "tab");
    b.setAttribute("aria-selected", fi.f === cur);
    b.innerHTML = `${fi.label}<span class="n">${s.tr}/${s.tgt} · 검수 ${s.rv}</span>`;
    b.onclick = () => { cur = fi.f; try{localStorage.setItem("tab",cur)}catch(e){}; renderAll(); };
    el.appendChild(b);
  }
  const fi = fileOf(cur), s = stats(fi);
  const pct = Math.min(100, Math.round(100 * s.bytes / fi.avail));
  $("#bt").textContent = `용량 ${s.bytes.toLocaleString()} / ${fi.avail.toLocaleString()}B`;
  $("#bi").style.width = pct + "%";
  $("#budget").classList.toggle("over", s.bytes > fi.avail);
}

function markMissing(kr) {
  const frag = document.createDocumentFragment();
  let buf = "";
  const flush = () => { if (buf) { frag.appendChild(document.createTextNode(buf)); buf = ""; } };
  for (const c of kr) {
    if (c >= "가" && c <= "힣" && !MAP.has(c)) {
      flush();
      const s = document.createElement("span"); s.className = "miss"; s.textContent = c;
      frag.appendChild(s);
    } else buf += c;
  }
  flush();
  return frag;
}

function renderTable() {
  const fi = fileOf(cur);
  const host = $("#tbl"); host.innerHTML = "";
  const t = document.createElement("table");
  t.innerHTML = `<colgroup><col class="c-id"><col><col><col><col class="c-w"><col class="c-st"></colgroup>
  <thead><tr><th>id</th><th>원문 (JP)</th><th>중국어역 (CN)</th><th>한국어 (KR)</th><th>경고</th><th>상태</th></tr></thead>`;
  const tb = document.createElement("tbody");
  let shown = 0;
  for (const r of fi.rows) {
    const e = eff(fi.f, r);
    const w = warns(r, e.kr);
    const match = !query || [r.id, r.jp, r.cn, e.kr].some(s => (s||"").toLowerCase().includes(query));
    const pass = filter === "all" ? true :
      filter === "todo" ? (!isBlank(r) && !e.kr) :
      filter === "warn" ? w.length > 0 :
      filter === "review" ? (e.kr && e.st < 2 && !isBlank(r)) :
      (e.st >= 2 && !isBlank(r));
    if (!match || !pass) continue;
    shown++;
    const trr = document.createElement("tr");
    trr.className = isBlank(r) ? "blank" : (e.st >= 2 ? "done" : "");
    const tdId = document.createElement("td"); tdId.className = "id"; tdId.textContent = r.id;
    const tdJp = document.createElement("td"); tdJp.className = "jp"; tdJp.textContent = r.jp;
    const tdCn = document.createElement("td"); tdCn.className = "cn"; tdCn.textContent = r.cn;
    const tdKr = document.createElement("td"); tdKr.className = "kr" + (e.kr ? "" : " empty");
    tdKr.appendChild(markMissing(e.kr));
    if (!isBlank(r)) tdKr.onclick = () => edit(fi, r, tdKr);
    const tdW = document.createElement("td");
    const bd = document.createElement("div"); bd.className = "badges";
    for (const [txt, cls] of w) {
      const s = document.createElement("span"); s.className = "b " + cls; s.textContent = txt;
      bd.appendChild(s);
    }
    if (isBlank(r)) { const s = document.createElement("span"); s.className="b m"; s.textContent="빈 행"; bd.appendChild(s); }
    tdW.appendChild(bd);
    const tdSt = document.createElement("td"); tdSt.className = "st";
    if (!isBlank(r)) {
      const c1 = document.createElement("span");
      c1.className = "chk" + (e.st >= 1 && e.kr ? " on1" : ""); c1.textContent = "번역";
      c1.onclick = () => setSt(fi, r, e.st >= 1 ? 0 : 1);
      const c2 = document.createElement("span");
      c2.className = "chk" + (e.st >= 2 ? " on2" : ""); c2.textContent = "검수";
      c2.onclick = () => setSt(fi, r, e.st >= 2 ? 1 : 2);
      const dot = document.createElement("span"); dot.className = "dot"; dot.dataset.d = docid(fi.f, r.k);
      tdSt.append(c1, c2, dot);
    }
    trr.append(tdId, tdJp, tdCn, tdKr, tdW, tdSt);
    tb.appendChild(trr);
  }
  t.appendChild(tb);
  host.appendChild(t);
  if (!shown) { const d = document.createElement("div"); d.id = "empty"; d.textContent = "조건에 맞는 행이 없습니다"; host.appendChild(d); }
}

function renderAll(){ renderTabs(); renderTable(); }

function edit(fi, r, td) {
  if (td.querySelector("textarea")) return;
  const e = eff(fi.f, r);
  const ta = document.createElement("textarea");
  ta.value = e.kr;
  ta.rows = Math.max(2, (r.jp.match(/\n/g) || []).length + 1);
  td.textContent = ""; td.appendChild(ta); ta.focus();
  ta.onblur = () => {
    const v = ta.value.replace(/\r\n/g, "\n").replace(/\s+$/, "");
    if (v !== e.kr) save(fi, r, { kr: v, st: v ? Math.max(1, e.st) : 0 });
    renderAll();
  };
}

function setSt(fi, r, st) {
  const e = eff(fi.f, r);
  if (st >= 1 && !e.kr) { note("번역문이 비어 있어 완료로 표시할 수 없습니다"); return; }
  save(fi, r, { kr: e.kr, st });
  renderAll();
}

let noteTimer;
function note(s){ $("#msg").textContent = s; clearTimeout(noteTimer);
  noteTimer = setTimeout(() => $("#msg").textContent = "", 5000); }

async function save(fi, r, val) {
  const id = docid(fi.f, r.k);
  docs[id] = val;
  if (!sb) { note("연결돼 있지 않아 이 기기에서만 보입니다"); return; }
  const dot = document.querySelector(`.dot[data-d="${id}"]`);
  if (dot) dot.className = "dot saving";
  const row = Object.assign({ id, f: fi.f, k: r.k, ts: Date.now(), by: nick }, val);
  const { error } = await sb.from("tr").upsert(row);
  if (error) {
    if (dot) dot.className = "dot fail";
    note("저장 실패: " + (error.code === "42501" ? "암호가 맞지 않습니다 — 새로고침 후 다시 입장"
                                                 : error.message));
  } else {
    lastTs = Math.max(lastTs, row.ts);
    if (dot) dot.className = "dot";
  }
}

$("#filter").value = filter;
$("#filter").onchange = ev => { filter = ev.target.value;
  try{localStorage.setItem("f",filter)}catch(e){}; renderTable(); };
let qTimer;
$("#q").oninput = ev => { clearTimeout(qTimer);
  qTimer = setTimeout(() => { query = ev.target.value.trim().toLowerCase(); renderTable(); }, 200); };

function measureHeader(){
  document.documentElement.style.setProperty("--thdr", $("#top").offsetHeight + "px");
}
addEventListener("resize", measureHeader);

renderAll(); measureHeader();

$("#nick").value = nick;
$("#nick").onchange = ev => { nick = ev.target.value.trim();
  try{localStorage.setItem("nick", nick)}catch(e){} };

function mergeRows(rows) {
  for (const v of rows) {
    docs[v.id] = { kr: v.kr !== undefined && v.kr !== null ? v.kr : "", st: v.st || 0 };
    if (v.ts > lastTs) lastTs = v.ts;
  }
  if (!document.querySelector("#tbl textarea")) renderAll();
  else renderTabs();
}

async function pull(initial) {
  if (!sb) return false;
  let q = sb.from("tr").select("*").limit(5000);
  if (!initial) q = q.gt("ts", lastTs);
  const { data, error } = await q;
  if (error) return false;
  mergeRows(data || []);
  return true;
}

function makeClient(pw) {
  return window.supabase.createClient(CFG.url, CFG.key,
    { global: { headers: { "x-team-code": pw } }, auth: { persistSession: false } });
}

async function connect(pw) {
  const cand = makeClient(pw);
  // RLS의 select 거부는 '빈 결과'라 오류가 안 남 → 전용 RPC로 암호 검증
  const { data, error } = await cand.rpc("team_ok");
  if (error || data !== true) return false;
  sb = cand;
  try { localStorage.setItem("pw", pw); } catch (e) {}
  await pull(true);
  $("#who").textContent = "연결됨 — 자동 저장";
  setInterval(() => pull(false), 15000);
  addEventListener("focus", () => pull(false));
  return true;
}

(async () => {
  if (!CFG || !window.supabase) { $("#who").textContent = "오프라인 미리보기 (저장 안 됨)"; return; }
  let pw = "";
  try { pw = localStorage.getItem("pw") || ""; } catch (e) {}
  if (pw && await connect(pw)) return;
  const gate = $("#gate");
  gate.hidden = false;
  $("#pw").focus();
  const go = async () => {
    $("#gateMsg").textContent = "";
    const v = $("#pw").value;
    if (!v) return;
    $("#pwGo").disabled = true;
    if (await connect(v)) gate.hidden = true;
    else $("#gateMsg").textContent = "암호가 맞지 않습니다";
    $("#pwGo").disabled = false;
  };
  $("#pwGo").onclick = go;
  $("#pw").addEventListener("keydown", ev => { if (ev.key === "Enter") go(); });
})();
</script>
